{% extends "base.html" %} {% block title %}Login – TraceNet{% endblock %} {% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 shadow-sm">
                <div class="card-header text-center border-0 pb-0">
                    <h1 class="h4">Sign In</h1>
                    <p class="text-muted">Access your TraceNet account.</p>
                </div>
                <div class="card-body pt-0">
                    <form method="post" action="{{ url_for('auth.login') }}">
                        <div class="mb-3">
                            <label class="form-label">Username or Email</label>
                            <input type="text" name="identifier" class="form-control" placeholder="Username or Email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>
                    <div class="text-center mt-3">
                        <small class="text-muted">New here? <a href="{{ url_for('auth.signup') }}">Create an account</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
